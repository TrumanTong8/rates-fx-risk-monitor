  symbol: EURUSD=X
  asset_class: FX
  direction: short
  view_link: short EUR versus USD.
  cftc_market: EURO FX
- name: Long Nasdaq 100
  symbol: ^NDX
  asset_class: Equity index
  direction: long
  view_link: Nasdaq-100 index proxy; cleaner index exposure than QQQ ETF for historical
    testing.
  cftc_market: NASDAQ MINI
- name: Long gold
  symbol: GC=F
  asset_class: Precious metal future
  direction: long
  view_link: Benefits if real yields and the dollar soften.
