groups:
  Equity ETFs:
    - name: "Long SPY"
      symbol: "SPY"
      asset_class: "Equity ETF"
      direction: "long"
      view_link: "Broad US equity beta."
      cftc_market: "E-MINI S&P 500"
    - name: "Long Nasdaq 100"
      symbol: "^NDX"
      asset_class: "Equity index"
      direction: "long"
      view_link: "Nasdaq-100 index proxy; cleaner index exposure than QQQ ETF for historical testing."
      cftc_market: "NASDAQ MINI"
    - name: "Long Russell 2000"
      symbol: "RTY=F"
      asset_class: "Equity index future"
      direction: "long"
      view_link: "US small-cap risk beta."
      cftc_market: "RUSSELL 2000 MINI"
  Rates:
