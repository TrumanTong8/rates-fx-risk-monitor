default_view:
  name: "Rates will not hike"
  thesis: "Policy rates are unlikely to rise further, so expressions that benefit from stable or lower real/nominal yields should be compared."
  horizon_days: 63

expressions:
  - name: "Long Nasdaq 100"
    symbol: "^NDX"
    asset_class: "Equity index"
    direction: "long"
    view_link: "Nasdaq-100 index proxy; cleaner index exposure than QQQ ETF for historical testing."
    cftc_market: "NASDAQ MINI"
  - name: "Long gold"
    symbol: "GC=F"
    asset_class: "Precious metal future"
    direction: "long"
    view_link: "Front COMEX gold future; benefits if real yields and the dollar soften."
    cftc_market: "GOLD"
  - name: "Long silver"
    symbol: "SI=F"
    asset_class: "Precious metal future"
    direction: "long"
    view_link: "Front COMEX silver future; benefits from precious-metals beta, with more cyclical sensitivity than gold."
    cftc_market: "SILVER"
  - name: "Long 2Y duration proxy"
    symbol: "SHY"
    asset_class: "Rates ETF"
    direction: "long"
    view_link: "Benefits if front-end yields stop rising or rally."
    cftc_market: "UST 2Y NOTE"
  - name: "Long JPY/USD"
    symbol: "JPYUSD=X"
    asset_class: "FX"
    direction: "long"
    view_link: "JPYUSD rises when JPY strengthens versus USD; this aligns with long Japanese yen futures positioning."
    cftc_market: "JAPANESE YEN"
